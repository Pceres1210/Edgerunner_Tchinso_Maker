<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>트친소표 메이커</title>

<style>
/* Layout: editor column on the left, sticky live preview of a fixed-width 600px framed card on the right; stacks on phones. */
/* One deliberate dark look in the card's own palette (black, signal yellow, tab red), whatever the viewer's theme */
:root {
  --bg: #0b0b0b;
  --surface: #151515;
  --fg: #f2f2f2;
  --muted: #9b9a8a;
  --line: #2e2e2e;
  --accent: #fcee0a;
  --accent-ink: #000000;
  --accent-soft: #2b2806;
  --red: #ff1438;
  --font-ui: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, sans-serif;
  --font-display: 'Orbitron', 'Black Han Sans', 'IBM Plex Sans KR', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: 'Orbitron', 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 22px; margin: 0; letter-spacing: .01em; text-wrap: balance; color: var(--accent); }
.brand small { font-family: var(--font-ui); font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 400; }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:disabled { opacity: .6; cursor: wait; }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); }

.wrap {
  max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 640px); gap: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
@media (max-width: 960px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

.editor { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sec h2 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sec h2 span { font-size: 13px; font-weight: 400; color: var(--muted); }
.note { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 0; }
.lbl { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: 15px; }
.in:focus { border-color: var(--accent); outline: none; }
textarea.in { resize: vertical; min-height: 44px; }
.checks { display: flex; gap: 18px; flex-wrap: wrap; color: var(--fg); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

.ava-edit { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ava-thumb { width: 72px; height: 72px; background: var(--accent-soft) center/cover no-repeat; flex: none; border: 2px solid var(--accent); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; }
.seg button[aria-pressed="true"] { background: var(--red); color: #ffffff; border-color: var(--red); }

.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.item.dragging { border-color: var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, .18); position: relative; z-index: 2; user-select: none; }
.item-top { display: flex; gap: 8px; align-items: center; }
.item-top .in { font-weight: 700; padding-block: 6px; }
.handle { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; cursor: grab; touch-action: none; flex: none; border-radius: 6px; }
.handle:hover { color: var(--accent); }
.item.dragging .handle { cursor: grabbing; color: var(--accent); }
.seg-sm button { padding: 4px 12px; font-size: 13px; }
.tool { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; font-size: 13px; color: var(--muted); flex: none; }
.tool:hover { color: var(--accent); border-color: var(--accent); }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opt { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.opt button { border: 0; background: transparent; padding: 5px 4px 5px 12px; font-size: 14px; }
.opt .opt-x { padding: 5px 10px 5px 6px; color: var(--muted); }
.opt.on { background: var(--accent); border-color: var(--accent); }
.opt.on button { color: var(--accent-ink); }
.addopt { display: inline-flex; gap: 4px; }
.addopt .in { width: 120px; padding: 5px 10px; font-size: 14px; border-radius: 999px; }
.addopt .tool { border-radius: 999px; }
.add-line { border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; color: var(--muted); font-weight: 500; }
.add-line:hover { color: var(--accent); border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 10px; }

.preview { min-width: 0; }
.preview-in { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: flex; flex-direction: column; gap: 12px; }
.preview-cap { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
#holder { margin: 0 auto; }
#stage { width: 600px; transform-origin: top left; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(20, 12, 16, .6); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--surface); border-radius: 16px; padding: 16px; max-width: 640px; width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
.modal-box img { max-height: 70vh; object-fit: contain; align-self: center; }
.modal-box p { margin: 0; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; }

/* ---------- The card: fixed colors taken from the frame art so the exported PNG looks the same everywhere ---------- */
.tc {
  --c-bg: #000000; --c-ink: #f2f2f2; --c-red: #ff1438; --c-yellow: #fcee0a; --c-tabink: #000000;
  /* Lighter pairing for the nickname and the red tab labels (Black Han Sans has only one, very heavy weight) */
  --c-head-lite: 'Orbitron', 'Noto Sans KR', sans-serif;
  /* Latin and digits fall through to the techy faces, Hangul to the Korean gothics */
  --c-head: 'Orbitron', 'Black Han Sans', sans-serif; --c-body: 'Chakra Petch', 'Noto Sans KR', sans-serif;
  width: 600px; background: var(--c-bg); color: var(--c-ink); font-family: var(--c-body); position: relative;
}
.fr { position: absolute; left: 0; right: 0; background-repeat: no-repeat; }
.tc-name { font-family: var(--c-head-lite); font-weight: 700; font-size: 32px; line-height: 1.15; color: #ffffff; word-break: keep-all; overflow-wrap: anywhere; }
.tc-head { position: relative; display: flex; gap: 20px; padding: 0 52px; align-items: center; }
.tc-ava { width: 112px; height: 112px; border: 2px solid var(--c-yellow); background-color: #1a1a1a; background-position: center; background-size: cover; background-repeat: no-repeat; flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--c-head); font-size: 44px; color: var(--c-yellow); }
.tc-id { min-width: 0; }
.tc-handle { font-size: 17px; color: var(--c-yellow); margin-top: 4px; }
/* Label in the black gap right of the logo: the text sits on the logo's bottom line (y 97.5)
   and stops short of the stepped edge that starts at x 445 */
.tc-title { position: absolute; z-index: 1; left: 302px; top: 54px; width: 136px; height: 44px; display: flex; align-items: flex-end; justify-content: center; font-family: var(--c-head); font-size: 30px; line-height: 1; letter-spacing: .04em; color: var(--c-yellow); white-space: nowrap; }
.tc-bio { margin: 8px 0 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.tc-grid { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 22px 52px 0; }
.cell { position: relative; min-width: 0; }
.cell-tab { position: absolute; left: 0; top: 0; z-index: 1; display: flex; align-items: center; padding-left: 12px; font-family: var(--c-head-lite); font-weight: 700; font-size: 14px; color: var(--c-tabink); white-space: nowrap; overflow: hidden; }
.cell-body { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
.tc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tc-chip { border: 1px solid var(--c-yellow); color: var(--c-yellow); padding: 1px 10px; font-size: 14px; line-height: 1.6; }
.tc-cv { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.tc-foot { position: relative; text-align: center; font-family: var(--c-head-lite); font-weight: 700; line-height: 1.45; font-size: 18px; color: var(--c-yellow); white-space: pre-wrap; padding: 22px 52px 0; }

@media (prefers-reduced-motion: no-preference) { .btn, .opt { transition: border-color .15s, background-color .15s; } }

<header class="top">
  <div class="top-in">
    <h1 class="brand">사이버펑크 엣지러너 2 트친소표 메이커<small>항목을 채우고 이미지로 저장하세요</small></h1>
    <div class="top-actions">
      <button class="btn danger" id="reset" type="button">초기화</button>
      <button class="btn primary" id="export" type="button">이미지로 저장</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="editor">
    <p class="note" id="sample-note">지금은 예시 내용이 들어 있어요. 내 정보로 바꾸면 오른쪽 미리보기에 바로 반영되고, 이 브라우저에 자동으로 저장돼요.</p>

    <section class="sec">
      <h2>기본 정보</h2>
      <div class="ava-edit">
        <div class="ava-thumb" id="ava-thumb"></div>
        <label class="btn file-btn">프로필 사진 올리기<input type="file" id="f-ava" accept="image/*"></label>
        <button class="btn" id="ava-del" type="button">사진 지우기</button>
      </div>
      <div class="row2">
        <label class="lbl" for="f-name">닉네임<input class="in" id="f-name" maxlength="20"></label>
        <label class="lbl" for="f-handle">아이디 (@ 없이)<input class="in" id="f-handle" maxlength="30"></label>
      </div>
      <div class="lbl">작성목적 <span>표 오른쪽 위, 로고 옆에 크게 들어가요</span>
        <div class="checks" role="radiogroup" aria-label="작성목적">
          <label class="check" for="p-intro"><input type="radio" name="purpose" id="p-intro" value="intro">자기소개</label>
          <label class="check" for="p-tchinso"><input type="radio" name="purpose" id="p-tchinso" value="tchinso">트친소</label>
        </div>
      </div>
      <label class="lbl" for="f-bio">한 줄 소개<textarea class="in" id="f-bio" rows="2" maxlength="200"></textarea></label>
    </section>

    <section class="sec">
      <h2>항목 <span>⠿ 를 끌어서 순서 바꾸기 · 태그는 눌러서 켜고 끄기 · 빈 항목은 표에서 빠져요</span></h2>
      <div class="list" id="items"></div>
      <button class="add-line" id="add-item" type="button">+ 항목 추가</button>
    </section>

    <section class="sec">
      <h2>마무리 문구</h2>
      <label class="lbl" for="f-foot">표 맨 아래에 들어가요<textarea class="in" id="f-foot" rows="2" maxlength="160"></textarea></label>
    </section>
  </div>

  <aside class="preview">
    <div class="preview-in">
      <div class="preview-cap"><span>미리보기</span><span>저장 크기 1200px 폭 PNG</span></div>
      <div id="holder"><div id="stage"><div id="card"></div></div></div>
    </div>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <p>이 화면에서는 바로 저장할 수 없어요. 이미지를 길게 누르거나 우클릭해서 저장해 주세요.</p>
    <img id="modal-img" alt="완성된 트친소표 이미지">
    <button class="btn" id="modal-close" type="button">닫기</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.items) {
      // Earlier drafts had separate 메인트/트친소 boxes
      if (!s.purpose) s.purpose = s.purposeMain && !s.purposeTchinso ? 'intro' : 'tchinso';
      // Drafts started before 최애/지뢰 joined the preset get them as empty boxes at the end
      if ((s.presetVer || 1) < 2) {
        ['최애', '지뢰'].forEach(l => { if (!s.items.some(i => i.label === l)) s.items.push(textItem(l, '')); });
        s.presetVer = PRESET_VER;
      }
      return s;
    }
    // Drafts from before the current preset: keep who they are, start the items from the new preset
    const old = JSON.parse(localStorage.getItem('tchinso-maker-v2') || localStorage.getItem('tchinso-maker-v1'));
    if (!old) return null;
    const { name, handle, bio, avatar, footer } = old;
    return { ...sample(), isSample: false, name, handle, bio, avatar: avatar || '', footer };
  } catch (e) { return null; }
}
let saveTimer, quotaWarned = false;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) {
      if (!quotaWarned) { quotaWarned = true; toast('자동 저장이 안 돼요. 닫기 전에 이미지로 저장해 두세요.'); }
    }
  }, 300);
}

let state = load() || sample();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function touched() {
  if (state.isSample) { state.isSample = false; $('#sample-note').hidden = true; }
  persist();
  renderCard();
}

/* ---------- Card ---------- */
// Lays the frame over a box of width w: top and bottom keep the art's proportions, only the middle stretches.
function frame(w, F = FRAME) {
  const full = w * F.ratio;
  const t = Math.round(full * F.topKeep), b = Math.round(full * F.botKeep);
  const html = `<div class="fr" style="top:${t}px;bottom:${b}px;background-image:url('${F.mid}');background-size:100% 100%"></div>`
    + `<div class="fr" style="top:0;height:${t}px;background-image:url('${F.top}');background-size:100% auto;background-position:top left"></div>`
    + `<div class="fr" style="bottom:0;height:${b}px;background-image:url('${F.bot}');background-size:100% auto;background-position:bottom left"></div>`;
  const tab = F.tab || { w: 0, h: 0 };
  return { html, t, b, tabW: Math.round(w * tab.w), tabH: Math.round(full * tab.h) };
}

function renderCard() {
  const initial = (state.name || '?').trim().charAt(0) || '?';
  const ava = state.avatar
    ? `<div class="tc-ava" style="background-image:url('${state.avatar}')"></div>`
    : `<div class="tc-ava">${esc(initial)}</div>`;

  const card = frame(CARD_W, CARD_FRAME);
  const handle = state.handle ? `<div class="tc-handle">@${esc(state.handle.replace(/^@+/, ''))}</div>` : '';
  const bio = state.bio.trim();

  const cellW = (CARD_W - PAD * 2 - 10) / 2;
  const cf = frame(cellW);
  // Long titles shrink to fit the fixed red tab (Hangul ≈ 1em wide, Latin and spaces ≈ 0.6em)
  const tabSize = label => {
    const units = [...label].reduce((n, ch) => n + (/[ㄱ-힝]/.test(ch) ? 1 : 0.6), 0) || 1;
    return Math.max(9, Math.min(14, Math.floor((cf.tabW - 22) / units)));
  };
  const box = (label, inner) => `<div class="cell" style="min-height:${cf.t + cf.b + 40}px">${cf.html}
      <div class="cell-tab" style="width:${cf.tabW}px;height:${cf.tabH}px;font-size:${tabSize(label)}px">${esc(label)}</div>
      <div class="cell-body" style="padding:${cf.tabH + 10}px 14px ${cf.b + 6}px">${inner}</div>
    </div>`;
  const chips = on => `<div class="tc-chips">${on.map(o => `<span class="tc-chip">${esc(o.t)}</span>`).join('')}</div>`;
  const cells = state.items.map(it => {
    const on = it.mode !== 'text' ? it.options.filter(o => o.on) : [];
    const text = it.mode !== 'tags' ? it.value.trim() : '';
    if (!on.length && !text) return '';
    return box(it.label, (on.length ? chips(on) : '') + (text ? `<div class="tc-cv">${esc(text)}</div>` : ''));
  }).join('');

  $('#card').innerHTML = `
    <div class="tc" style="padding-bottom:${state.footer.trim() ? 44 : card.b + 6}px;min-height:${card.t + card.b + 120}px">
      ${card.html}
      <div class="tc-title">${state.purpose === 'intro' ? '자기소개' : '트친소'}</div>
      <div class="tc-head" style="padding-top:${Math.round(CARD_W * CARD_FRAME.ratio * 0.44)}px">${ava}
        <div class="tc-id"><div class="tc-name">${esc(state.name) || '닉네임'}</div>${handle}${bio ? `<p class="tc-bio">${esc(bio)}</p>` : ''}</div>
      </div>
      ${cells ? `<div class="tc-grid">${cells}</div>` : ''}
      ${state.footer.trim() ? `<div class="tc-foot">${esc(state.footer.trim())}</div>` : ''}
    </div>`;
  fit();
}

function fit() {
  const box = $('.preview');
  const s = Math.min(1, box.clientWidth / CARD_W);
  $('#stage').style.transform = `scale(${s})`;
  $('#holder').style.width = CARD_W * s + 'px';
  $('#holder').style.height = $('#card').offsetHeight * s + 'px';
}
new ResizeObserver(fit).observe(document.querySelector('.preview'));
document.fonts && document.fonts.ready.then(fit);

/* ---------- Editor ---------- */
function renderAvatarThumb() {
  $('#ava-thumb').style.backgroundImage = state.avatar ? `url('${state.avatar}')` : 'none';
  $('#ava-del').hidden = !state.avatar;
}
function renderItems() {
  $('#items').innerHTML = state.items.map(it => `
    <div class="item" data-id="${it.id}">
      <div class="item-top">
        <button type="button" class="handle" aria-label="${esc(it.label)} 순서 옮기기 (끌거나 위아래 화살표 키)">⠿</button>
        <input class="in" id="il-${it.id}" data-act="label" value="${esc(it.label)}" aria-label="제목" placeholder="제목" maxlength="12">
        <button type="button" class="tool" data-act="del">삭제</button>
      </div>
      <div class="seg seg-sm" role="group" aria-label="내용 종류">
        ${MODES.map(([k, n]) => `<button type="button" data-act="mode" data-mode="${k}" aria-pressed="${it.mode === k}">${n}</button>`).join('')}
      </div>
      ${it.mode !== 'text' ? `<div class="chipset">
        ${it.options.map((o, i) => `<span class="opt${o.on ? ' on' : ''}"><button type="button" data-act="otoggle" data-i="${i}" aria-pressed="${o.on}">${esc(o.t)}</button><button type="button" class="opt-x" data-act="odel" data-i="${i}" aria-label="${esc(o.t)} 태그 지우기">×</button></span>`).join('')}
        <form class="addopt"><input class="in" id="io-${it.id}" placeholder="태그 추가" maxlength="16" aria-label="새 태그"><button class="tool">추가</button></form>
      </div>` : ''}
      ${it.mode !== 'tags' ? `<textarea class="in" id="iv-${it.id}" data-act="value" rows="2" maxlength="300" placeholder="내용을 적어 주세요">${esc(it.value)}</textarea>` : ''}
    </div>`).join('');
}
function renderAll() {
  $('#sample-note').hidden = !state.isSample;
  $('#f-name').value = state.name;
  $('#f-handle').value = state.handle;
  $('#f-bio').value = state.bio;
  $('#f-foot').value = state.footer;
  $('#p-' + (state.purpose === 'intro' ? 'intro' : 'tchinso')).checked = true;
  renderAvatarThumb(); renderItems(); renderCard();
}

[['#f-name', 'name'], ['#f-handle', 'handle'], ['#f-bio', 'bio'], ['#f-foot', 'footer']].forEach(([sel, key]) => {
  $(sel).addEventListener('input', e => { state[key] = e.target.value; touched(); });
});
document.querySelectorAll('input[name="purpose"]').forEach(r =>
  r.addEventListener('change', e => { state.purpose = e.target.value; touched(); }));

const itemOf = el => state.items.find(x => x.id === el.closest('[data-id]').dataset.id);
$('#items').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const it = itemOf(b), i = +b.dataset.i;
  if (b.dataset.act === 'mode') it.mode = b.dataset.mode;
  else if (b.dataset.act === 'otoggle') it.options[i].on = !it.options[i].on;
  else if (b.dataset.act === 'odel') it.options.splice(i, 1);
  else if (b.dataset.act === 'del') state.items = state.items.filter(x => x !== it);
  else return;
  renderItems(); touched();
});
$('#items').addEventListener('input', e => {
  const act = e.target.dataset.act;
  if (act !== 'label' && act !== 'value') return;
  itemOf(e.target)[act] = e.target.value; touched();
});
$('#items').addEventListener('submit', e => {
  e.preventDefault();
  const input = e.target.querySelector('input');
  const t = input.value.trim(); if (!t) return;
  const it = itemOf(e.target);
  it.options.push({ t, on: true });
  renderItems(); touched();
  document.getElementById('io-' + it.id)?.focus();
});
$('#add-item').addEventListener('click', () => {
  const it = { id: nid(), label: '새 항목', mode: 'both', options: [], value: '' };
  state.items.push(it); renderItems(); touched();
  document.getElementById('il-' + it.id)?.select();
});

/* Reorder: drag the ⠿ handle (mouse or touch), or focus it and use the arrow keys */
let drag = null;
$('#items').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h || e.button > 0) return;
  e.preventDefault();
  drag = h.closest('.item');
  drag.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
// Neighbours move around the dragged item, never the item itself: detaching it would drop the
// pointer capture, and the release could then land outside the list and never save the order.
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const mid = el => el.getBoundingClientRect().top + el.offsetHeight / 2;
  let n;
  while ((n = drag.nextElementSibling) && e.clientY > mid(n)) drag.before(n);
  while ((n = drag.previousElementSibling) && e.clientY < mid(n)) drag.after(n);
  if (e.clientY < 90) window.scrollBy(0, -14);
  else if (e.clientY > innerHeight - 60) window.scrollBy(0, 14);
});
function endDrag() {
  if (!drag) return;
  drag.classList.remove('dragging'); drag = null;
  const order = [...$('#items').children].map(c => c.dataset.id);
  state.items.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  touched();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
$('#items').addEventListener('keydown', e => {
  const h = e.target.closest('.handle');
  if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const it = itemOf(h), i = state.items.indexOf(it), j = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (j < 0 || j >= state.items.length) return;
  [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  renderItems(); touched();
  document.querySelector(`.item[data-id="${it.id}"] .handle`).focus();
});

/* Avatar: crop to a centered square and shrink so the draft stays small */
$('#f-ava').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), out = 480;
      const c = document.createElement('canvas'); c.width = c.height = out;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
      state.avatar = c.toDataURL('image/jpeg', 0.9);
      renderAvatarThumb(); touched();
    };
    img.onerror = () => toast('이미지를 열 수 없어요. 다른 파일을 골라 주세요.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});
$('#ava-del').addEventListener('click', () => { state.avatar = ''; renderAvatarThumb(); touched(); });

let resetArmed;
$('#reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!resetArmed) {
    b.textContent = '한 번 더 누르면 초기화'; resetArmed = setTimeout(() => { b.textContent = '초기화'; resetArmed = null; }, 3000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = '초기화';
  state = sample();
  try { ['tchinso-maker-v1', 'tchinso-maker-v2', KEY].forEach(k => localStorage.removeItem(k)); } catch (err) {}
  renderAll(); toast('예시 내용으로 되돌렸어요');
});

/* ---------- Export ---------- */
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
const downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
let lastUrl;

$('#export').addEventListener('click', async e => {
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = '만드는 중…';
  try {
    if (document.fonts) await document.fonts.ready;
    const canvas = await html2canvas($('#card').firstElementChild, {
      scale: 2, backgroundColor: null, logging: false,
      onclone: doc => { doc.getElementById('stage').style.transform = 'none'; }
    });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const safe = (state.name || '나').replace(/[\\/:*?"<>|]/g, '').trim() || '나';
    const filename = `트친소표_${safe}.png`;
    const downloads = await downloadsP;
    if (downloads) {
      try {
        await downloads.save({ filename, data: blob });
        toast('이미지를 저장했어요'); return;
      } catch (err) {
        if (err && err.code === 'declined') { toast('저장을 취소했어요'); return; }
        if (err && err.code === 'rate_limited') { toast('잠시 후 다시 눌러 주세요'); return; }
      }
    }
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    $('#modal-img').src = lastUrl; $('#modal').hidden = false;
  } catch (err) {
    toast('이미지를 만들지 못했어요. 다시 시도해 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = '이미지로 저장';
  }
});
$('#modal-close').addEventListener('click', () => { $('#modal').hidden = true; });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });

renderAll();
</script>

</body></html>
